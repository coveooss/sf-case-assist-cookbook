<template>
  <c-quantic-search-interface
    engine-id={engineId}
    search-hub={searchHub}
    pipeline={pipeline}
    disable-state-in-url
    skip-first-search
  >
    <div class="slds-var-p-top_medium">
      <c-quantic-generated-answer engine-id={engineId}></c-quantic-generated-answer>
    </div>
    
    <div class="slds-var-p-top_medium">
      <c-quantic-smart-snippet-list engine-id={engineId}></c-quantic-smart-snippet-list>
    </div>
    
    <div class="slds-var-p-top_medium">
      <c-quantic-triggers engine-id={engineId}></c-quantic-triggers>
    </div>
    
    <div class="slds-var-p-top_medium">
      <c-quantic-result-list engine-id={engineId} fields-to-include="date,author,source,language,filetype">
        <c-vote-count-wrapper slot="rating"></c-vote-count-wrapper>
        <c-vote-tracker-wrapper
          engine-id={engineId}
          slot="actions"
        ></c-vote-tracker-wrapper>
        <c-quickview-footer-wrapper
          engine-id={engineId}
          slots-to-be-hidden={slotsToBeHidden}
          slot="quickview-footer"
        ></c-quickview-footer-wrapper>
        <template slot="no-results">
          <div class="slds-align_absolute-center">
            <c-send-request-svg></c-send-request-svg>
          </div>
          <div class="slds-align_absolute-center slds-var-m-top_large">
            <c-create-case-button
              engine-id={engineId}
              case-data={caseData}
            ></c-create-case-button>
          </div>
        </template>
      </c-quantic-result-list>
    </div>
    
    <div class="slds-var-p-top_medium slds-align_absolute-center">
      <c-quantic-pager engine-id={engineId}></c-quantic-pager>
    </div>
  </c-quantic-search-interface>
</template>
